services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mealog
      POSTGRES_PASSWORD: mealog
      POSTGRES_DB: mealog
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealog"]
      interval: 5s
      retries: 10

  api:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      VISION_PROVIDER: fixture
      DEFAULT_LOCALE: en_US
      LOG_LEVEL: INFO
    command: >-
      sh -c "pip install --disable-pip-version-check --no-cache-dir -q -e server
      && python -m uvicorn mealog.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
