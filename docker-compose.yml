services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mealog
      POSTGRES_PASSWORD: mealog
      POSTGRES_DB: mealog
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealog"]
      interval: 5s
      retries: 10

  api:
    image: node:20-alpine
    working_dir: /workspace/server
    volumes:
      - .:/workspace
    environment:
      NODE_ENV: production
      PORT: 3000
      DEFAULT_LOCALE: tr
      VISION_PROVIDER: fixture
      LOG_LEVEL: INFO
    command: >-
      sh -c "npm install && npm run build && node dist/src/main.js"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

