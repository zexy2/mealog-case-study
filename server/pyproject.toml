[project]
name = "mealog"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  # FastAPI needs this parser for the photo-ingest multipart contract.
  "python-multipart>=0.0.20",
  # Retrieval scoring (TF-IDF vectorisers for word and char n-grams). A runtime
  # dependency, not a dev one: pipeline/retrieval.py imports it at module load.
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  # Required by fastapi.testclient -> starlette.testclient.
  # httpx2 is the Pydantic-stewarded continuation of httpx (pinned >=2.12).
  "httpx2>=2.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
