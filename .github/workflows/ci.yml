name: ci
on: [push, pull_request]

# The default token is contents-only. The scope gate has to read the pull
# request and the claim issue it links to, so those scopes are requested
# explicitly and kept read-only.
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git diff origin/main...HEAD` needs the merge base, which a shallow
          # clone does not have.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: secret guard
        run: python scripts/check_secrets.py --diff-base origin/main
      - run: cd server && python -m pip install -e ".[dev]" -q

      - name: lint
        run: cd server && python -m ruff check src tests ../scripts

      - name: tests
        run: cd server && python -m pytest -q

      # Architectural rules from AGENTS.md section 9. Prose rules get broken when
      # several agents edit in parallel; these fail the build instead.
      - name: invariants
        run: python scripts/check_invariants.py

      # A claim issue is the only lock between agents (AGENTS.md section 3).
      # Checking it is what makes it a lock rather than a convention.
      - name: pull request stays inside its declared scope
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_claim_scope.py

      # STATUS.md is generated, not written. If it disagrees with the tree, the
      # repository is making a claim about itself that is no longer true.
      - name: status is current
        run: python scripts/status.py --check

      # Offline eval must reproduce, and no cuisine bucket may regress.
      - name: eval regression guard
        run: python eval/harness.py --configs V0,V1,V2,V3 --check-regression

  # Node gates for the TypeScript backend (port epic #106), running *alongside*
  # the Python gates above rather than replacing them. Nothing Python is
  # removed: the Python backend stays the parity reference until the Wave 3
  # parity gate passes.
  #
  # The `invariants` step in the check job already enforces that src/domain/ and
  # src/pipeline/ import no framework, and it needs no Node, so that boundary is
  # still guarded even if this job is skipped.
  server-node:
    name: server (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to the same major as `engines.node` in server/package.json,
          # so the reviewer's machine and CI agree.
          node-version: "22"
          cache: npm
          # server and apps/mobile are independent workspaces with their own
          # lockfiles; no monorepo tool is introduced for this.
          cache-dependency-path: server/package-lock.json
      - name: install server dependencies
        run: npm ci
      - name: build
        run: npm run build
      - name: lint
        run: npm run lint
      - name: tests
        run: npm run test

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: install mobile dependencies
        run: npm ci
      - name: typecheck mobile app
        run: npx tsc --noEmit
      - name: bundle Expo mobile app
        run: npx expo export

  # Rulesets would prevent this, but GitHub does not enforce them on private
  # repositories outside a Team plan. Detection is the available substitute:
  # a direct push still lands, but main goes red and names the commit.
  main-arrived-via-pull-request:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_main_push.py
